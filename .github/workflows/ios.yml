name: iOS companion build
on:
  push:
    branches:
      - main
    paths:
      - 'companion/ios/**'
      - '.github/workflows/ios.yml'
  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review
    paths:
      - 'companion/ios/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Source sanity
        run: python3 scripts/verify-source.py
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: companion/ios
        run: xcodegen generate
      - name: iOS protocol unit tests
        working-directory: companion/ios
        run: |
          DEVICE_ID="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ {print $2; exit}')"
          if [ -z "$DEVICE_ID" ]; then
            echo "No available iPhone simulator found."
            exit 1
          fi
          xcodebuild \
            -project ConPhoneCompanion.xcodeproj \
            -scheme ConPhoneCompanion \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            CODE_SIGNING_ALLOWED=NO \
            test
      - name: Build iOS Companion
        working-directory: companion/ios
        run: |
          xcodebuild \
            -project ConPhoneCompanion.xcodeproj \
            -scheme ConPhoneCompanion \
            -configuration Debug \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO \
            build
