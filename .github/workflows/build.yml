name: Windows build and core tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Core behavior tests (no hardware claims)
        run: dotnet run --project tests/ConPhone.Tests -c Release
      - name: Build Windows application
        run: dotnet build src/ConPhone.Windows -c Release
      - name: Publish portable Windows x64
        run: dotnet publish src/ConPhone.Windows -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o artifacts/Con.Phone-win-x64
      - name: Include user documentation
        shell: pwsh
        run: |
          Copy-Item README.md artifacts/Con.Phone-win-x64/README.ko.md
          Copy-Item -Recurse docs artifacts/Con.Phone-win-x64/docs
      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: Con.Phone-win-x64
          path: artifacts/Con.Phone-win-x64/
          retention-days: 14
      - name: Source snapshot
        shell: pwsh
        run: git archive --format=zip --output=Con.Phone-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: Con.Phone-source
          path: Con.Phone-source.zip
          retention-days: 14
