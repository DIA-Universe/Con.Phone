name: Windows build and core tests
on:
  push:
    branches:
      - main
      - feature/clipboard-text-image-sync
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
        working-directory: 'C:\'
    steps:
      # CON.anything is a reserved Windows path. Keep the GitHub repository name,
      # but download the exact commit to a safe directory outside GITHUB_WORKSPACE.
      - name: Fetch exact source commit to a Windows-safe path
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }
          $zip = Join-Path $env:RUNNER_TEMP 'ConPhone-source.zip'
          Invoke-WebRequest -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/zipball/$env:GITHUB_SHA" -Headers $headers -OutFile $zip
          $unpack = Join-Path $env:RUNNER_TEMP 'conphone-unpack'
          Expand-Archive -Path $zip -DestinationPath $unpack
          $root = Get-ChildItem -Directory $unpack | Select-Object -First 1
          Move-Item $root.FullName (Join-Path $env:RUNNER_TEMP 'conphone-src')
      - name: Source sanity
        run: python "$env:RUNNER_TEMP/conphone-src/scripts/verify-source.py"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Core tests, Windows build, clipboard, snapshots and executable verification
        run: '& "$env:RUNNER_TEMP/conphone-src/scripts/verify-windows.ps1" -Configuration Release -OutputRoot "$env:RUNNER_TEMP/ConPhone-verified"'
      - name: Upload UI snapshots
        uses: actions/upload-artifact@v4
        with:
          name: ConPhone-ui-snapshots
          path: ${{ runner.temp }}/ConPhone-verified/ui/*.png
          if-no-files-found: error
          retention-days: 14
      - name: Upload ConPhone.exe
        uses: actions/upload-artifact@v4
        with:
          name: ConPhone-win-x64-single-exe
          path: ${{ runner.temp }}/ConPhone-verified/win-x64/ConPhone.exe
          if-no-files-found: error
          retention-days: 14
      - name: Upload ConPhone.exe SHA256
        uses: actions/upload-artifact@v4
        with:
          name: ConPhone-win-x64-sha256
          path: ${{ runner.temp }}/ConPhone-verified/win-x64/ConPhone.exe.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Build self-update package
        run: |
          $package = Join-Path $env:RUNNER_TEMP 'ConPhone-update-package'
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item (Join-Path $env:RUNNER_TEMP 'ConPhone-verified\win-x64\ConPhone.exe') (Join-Path $package 'ConPhone.exe')
          Copy-Item (Join-Path $env:RUNNER_TEMP 'ConPhone-verified\win-x64\ConPhone.exe.sha256') (Join-Path $package 'ConPhone.exe.sha256')
      - name: Upload self-update package
        uses: actions/upload-artifact@v4
        with:
          name: ConPhone-win-x64-update-package
          path: ${{ runner.temp }}/ConPhone-update-package/*
          if-no-files-found: error
          retention-days: 14
      - name: Upload exact source archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ConPhone-source
          path: ${{ runner.temp }}/ConPhone-source.zip
          retention-days: 14
