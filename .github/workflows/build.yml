name: Windows build and core tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
        working-directory: 'C:\\'
    steps:
      # CON.anything is a reserved Windows path. Keep the GitHub repository name,
      # but download the exact commit to a safe directory outside GITHUB_WORKSPACE.
      - name: Fetch exact source commit to a Windows-safe path
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }
          $zip = Join-Path $env:RUNNER_TEMP 'ConPhone-source.zip'
          Invoke-WebRequest -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/zipball/$env:GITHUB_SHA" -Headers $headers -OutFile $zip
          $unpack = Join-Path $env:RUNNER_TEMP 'conphone-unpack'
          Expand-Archive -Path $zip -DestinationPath $unpack
          $root = Get-ChildItem -Directory $unpack | Select-Object -First 1
          Move-Item $root.FullName (Join-Path $env:RUNNER_TEMP 'conphone-src')
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Core behavior tests (no hardware claims)
        run: dotnet run --project "$env:RUNNER_TEMP/conphone-src/tests/ConPhone.Tests" -c Release
      - name: Build Windows application
        run: dotnet build "$env:RUNNER_TEMP/conphone-src/src/ConPhone.Windows" -c Release
      - name: Publish one self-contained Windows x64 EXE
        run: |
          dotnet publish "$env:RUNNER_TEMP/conphone-src/src/ConPhone.Windows" `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:PublishTrimmed=false `
            -p:PublishReadyToRun=false `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o "$env:RUNNER_TEMP/ConPhone-win-x64"
      - name: Verify exactly one distributable file
        run: |
          $ErrorActionPreference = 'Stop'
          $publish = Join-Path $env:RUNNER_TEMP 'ConPhone-win-x64'
          $exe = Join-Path $publish 'ConPhone.exe'
          if (!(Test-Path $exe -PathType Leaf)) { throw 'ConPhone.exe was not produced.' }
          $files = @(Get-ChildItem $publish -File)
          $unexpected = @($files | Where-Object Name -ne 'ConPhone.exe')
          if ($unexpected.Count -gt 0) {
            $names = ($unexpected.Name -join ', ')
            throw "Single-file publish produced unexpected files: $names"
          }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
          $size = (Get-Item $exe).Length
          Write-Host "ConPhone.exe size=$size SHA256=$hash"
      - name: Upload ConPhone.exe
        uses: actions/upload-artifact@v4
        with:
          name: ConPhone-win-x64-single-exe
          path: ${{ runner.temp }}/ConPhone-win-x64/ConPhone.exe
          if-no-files-found: error
          retention-days: 14
      - name: Upload exact source archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ConPhone-source
          path: ${{ runner.temp }}/ConPhone-source.zip
          retention-days: 14
